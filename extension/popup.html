<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>读取当前岗位</title><link rel="stylesheet" href="popup.css"><script type="module" src="popup.js"></script></head><body>
<h1>读取岗位</h1><p>可导入当前岗位，或在职位搜索页按目标数量批量读取。</p><button id="batch" class="primary">批量导入搜索结果</button>
<details><summary>连接本机工作台</summary><label>本机连接密钥<input id="key" type="password" autocomplete="off"></label><button id="save">保存密钥</button><p>从工作台「简历与设置」复制。本扩展仅向 127.0.0.1:8765 传送岗位字段。</p></details>
