<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>定向投递 · 批量导入</title><link rel="stylesheet" href="batch.css"><script type="module" src="batch.js"></script></head><body><main><p class="brand">定向投递 / 读取扩展</p><h1>把这次筛选，收进一个批次</h1><p>逐个读取搜索页的完整岗位描述。数量只计算成功新增的岗位。</p><section><label>批次名称<input id="name" maxlength="100" placeholder="例如 北京 · 数据产品经理"></label><label>成功新增目标<input id="target" type="number" min="1" max="200" value="30"></label><fieldset><legend>采集节奏</legend><div class="timing-grid"><label>最小间隔（秒）<input id="interval-min" type="number" min="1" max="3600" step="1" value="3"></label><label>最大间隔（秒）<input id="interval-max" type="number" min="1" max="3600" step="1" value="5"></label><label>每操作多少次休息（含翻页）<input id="rest-every" type="number" min="1" max="200" step="1" value="10"></label><label>每次休息（秒）<input id="rest-seconds" type="number" min="1" max="3600" step="1" value="60"></label></div><p class="hint">打开岗位详情、翻页或滚动加载，各算一次操作，之后在范围内随机等待。失败也计数，直接跳过重复岗位不计数。分段休息不短于当次间隔；暂停后可调整，未结束的等待会保留。</p></fieldset><div class="actions"><button id="start">开始导入</button><button id="resume" hidden>继续导入</button><button id="pause" hidden>暂停</button><button id="stop" hidden>停止本批次</button></div></section><section aria-live="polite"><h2 id="progress">准备开始</h2><progress id="bar" value="0" max="30"></progress><p id="status">请先在 BOSS 职位页筛选好岗位，再从插件打开此页面。</p></section><p class="hint">运行期间请保留此控制页和 BOSS 标签页，保持筛选条件不变。遇到验证时会暂停，已导入的岗位会保留。</p><a href="http://127.0.0.1:8765/" target="_blank" rel="noopener">打开工作台查看批次 ↗</a></main></body></html>
